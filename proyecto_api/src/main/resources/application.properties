# ============================================================
# Configuracion de la API REST - Sistema de Inventario PAE (AA3-EV01)
# ============================================================

spring.application.name=inventario-pae-api

# Conexion a la misma base de datos creada en AA2 (sql/schema.sql)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/inventario_pae?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# La tabla ya existe (creada por sql/schema.sql) -> "none" para no alterarla.
# Cambiar a "validate" si se quiere que Hibernate compare el modelo con la BD al iniciar.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
